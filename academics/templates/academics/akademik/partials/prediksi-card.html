<!-- obj adalah instance siswa -->
<div class="w-full">

    <div class="bg-white shadow rounded-lg overflow-hidden">

        <!-- Header -->
        <div class="border-b px-6 py-4">
            
            <h1 class="text-2xl font-bold text-gray-800">
                {{ title|default:"Detail Data Akademik" }}
            </h1>
            <p class="text-sm text-gray-500 mt-1">
                {{ page_description|default:"Informasi lengkap data akademik" }}
            </p>
        </div>

        <!-- Content -->
        <div class="p-6">

            <dl class="divide-y divide-gray-200">

                

                <div
                    class="py-4 grid grid-cols-1 md:grid-cols-3 gap-2"
                 >
                    <dt class="font-medium text-gray-600">
                        Hasil Prediksi
                    </dt>
                    <dd 
                        x-show="!submitPrediksiLoading" x-cloak
                        class="md:col-span-2 text-gray-900" 
                        x-text="hasilPrediksi"
                        >
                    </dd>
                    <span x-show="submitPrediksiLoading" x-cloak>...</span>
                </div>


            </dl>

        </div>

        <!-- Footer -->
        <div class="border-t px-6 py-4 flex flex-wrap gap-2">

            <a
                x-text="labelButtonPrediksi"
                x-show="!submitPrediksiLoading" x-cloak
                @click.prevent="$dispatch('submit-prediksi', {siswa_id: '{{ obj.id }}'})"
                href="#"
                class="inline-flex items-center px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600"
            >
                
            </a>
            <span x-show="submitPrediksiLoading" x-cloak>Loading ...</span>

            <!-- <a
                href="{{ back_url }}"
                class="inline-flex items-center px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300"
            >
                Kembali
            </a> -->

        </div>

    </div>

</div>

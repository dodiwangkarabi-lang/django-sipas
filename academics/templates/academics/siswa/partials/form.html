
<div class="w-full">

    <div class="bg-white rounded-lg shadow p-6">
        <h1 class="text-2xl font-bold mb-6">
            {% if form.instance.pk %}
                Edit Siswa
            {% else %}
                Tambah Siswa
            {% endif %}
        </h1>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <!-- Nama -->
            <div>
                <label
                    for="{{ form.nama.id_for_label }}"
                    class="block text-sm font-medium text-gray-700 mb-1"
                >
                    Nama
                </label>

                <input
                    type="text"
                    name="{{ form.nama.name }}"
                    id="{{ form.nama.id_for_label }}"
                    value="{{ form.nama.value|default:'' }}"
                    class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-blue-500"
                >

                {% for error in form.nama.errors %}
                    <p class="text-sm text-red-600 mt-1">{{ error }}</p>
                {% endfor %}
            </div>

            <!-- NIS -->
            <div>
                <label
                    for="{{ form.nis.id_for_label }}"
                    class="block text-sm font-medium text-gray-700 mb-1"
                >
                    NIS
                </label>

                <input
                    type="text"
                    name="{{ form.nis.name }}"
                    id="{{ form.nis.id_for_label }}"
                    value="{{ form.nis.value|default:'' }}"
                    class="w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-blue-500"
                >

                {% for error in form.nis.errors %}
                    <p class="text-sm text-red-600 mt-1">{{ error }}</p>
                {% endfor %}
            </div>

            {% if form.non_field_errors %}
                <div class="rounded bg-red-50 p-3 text-red-700">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <div class="flex gap-2 pt-4">
                <button
                    type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md"
                >
                    Simpan
                </button>

                <a  
                    @click.prevent="closeEditForm"
                    href="{{ back_url }}"
                    class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-md"
                >
                    Batal
                </a>
            </div>
        </form>
    </div>

</div>

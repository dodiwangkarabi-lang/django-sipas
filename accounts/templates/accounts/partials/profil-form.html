<div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">

    <!-- Header -->
    <div class="px-6 py-4 border-b bg-gray-50">
        <h2 class="text-xl font-bold text-gray-800">
            Edit Profile
        </h2>
        <p class="text-sm text-gray-500">
            Perbarui informasi akun Anda
        </p>
    </div>

    <!-- Form -->
    <form method="post" enctype="multipart/form-data" @submit.prevent="$dispatch('submit-update-profil', { form : $event.target })">
        {% csrf_token %}

        <div class="p-6 space-y-6">

            <!-- Foto Profil -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Foto Profil
                </label>

                <div class="flex items-center gap-4">

                    {% if user.guru.foto %}
                    <img
                        src="{{ user.guru.foto.url }}"
                        alt="Profile"
                        class="w-20 h-20 rounded-full object-cover border"
                    >
                    {% endif %}

                    <input
                        type="file"
                        name="foto"
                        accept="image/*"
                        
                        class="block w-full text-sm text-gray-700
                               file:mr-4 file:py-2 file:px-4
                               file:rounded-lg file:border-0
                               file:bg-blue-50 file:text-blue-700
                               hover:file:bg-blue-100"
                    >
                </div>
            </div>

            <!-- Informasi Dasar -->
            <div class="grid md:grid-cols-2 gap-6">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        value="{{ user.username }}"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        value="{{ user.email|default_if_none:'' }}"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    >
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Nama Lengkap
                    </label>

                    <input
                        type="text"
                        name="nama"
                        value="{{ user.guru.nama|default_if_none:'' }}"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    >
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        NIP
                    </label>

                    <input
                        type="text"
                        name="nip"
                        value="{{ user.guru.nip|default_if_none:'' }}"
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    >
                </div>

            </div>

        </div>

        <!-- Footer -->
        <div class="px-6 py-4 bg-gray-50 border-t flex justify-end gap-3">

            <a href=""
               class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-100 transition">
                Batal
            </a>

            <button
                type="submit"
                class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                Simpan Perubahan
            </button>

        </div>

    </form>

</div>

{% extends "core/layouts/base_auth.html" %}

{% block content %}
    
  <div class="min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 sm:p-8 md:p-10">

      <!-- Header -->
      <!-- Header -->
      <div class="text-center mb-8">

        <h1 class="text-xl sm:text-2xl font-bold text-slate-900 leading-snug">
          Penerapan Random Forest
        </h1>

        <h2 class="text-sm sm:text-base font-semibold text-slate-600 mt-2 leading-snug">
          Prediksi Prestasi Akademik Siswa SDN 59 Buton
        </h2>

        <p class="mt-4 text-slate-500">
          Login ke sistem
        </p>

      </div>

      <!-- Messages -->
        {% if messages %}
        <div class="space-y-3 mb-5">

            {% for message in messages %}

            <div
                class="
                px-4 py-3 rounded-xl text-sm font-medium

                {% if message.tags == 'success' %}
                    bg-green-100 text-green-700 border border-green-200
                {% elif message.tags == 'error' %}
                    bg-red-100 text-red-700 border border-red-200
                {% elif message.tags == 'warning' %}
                    bg-yellow-100 text-yellow-700 border border-yellow-200
                {% else %}
                    bg-slate-100 text-slate-700 border border-slate-200
                {% endif %}
                "
            >
                {{ message }}
            </div>

            {% endfor %}

        </div>
        {% endif %}

      <!-- Form -->
      <form class="space-y-5" method="post" action="{% url 'accounts:login' %}">
        {% csrf_token %}

        <!-- Username -->
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-700">
            Username
          </label>

          <input
            type="text"
            placeholder="Masukkan username"
            name="username"
            required
            class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:ring-2 focus:ring-slate-900"
          />
        </div>

        <!-- Password -->
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-700">
            Password
          </label>

          <input
            type="password"
            placeholder="Masukkan password"
            name="password"
            required
            class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:ring-2 focus:ring-slate-900"
          />
        </div>

        <!-- Options -->
        <!-- <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 text-slate-600">
            <input type="checkbox" class="rounded">
            Remember me
          </label>

          <a href="#" class="text-slate-900 hover:underline">
            Lupa password?
          </a>
        </div> -->

        <!-- Button -->
        <button
          type="submit"
          class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-xl transition"
        >
          Login
        </button>

      </form>

      <!-- Footer -->
      <!-- <p class="mt-8 text-center text-sm text-slate-500">
        Belum punya akun?
        <a href="#" class="font-semibold text-slate-900 hover:underline">
          Daftar
        </a>
      </p> -->

    </div>

  </div>
{% endblock content %}

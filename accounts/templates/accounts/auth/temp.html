<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Login</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100">

  <div class="min-h-screen flex items-center justify-center px-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 sm:p-8 md:p-10">

      <!-- Header -->
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-slate-900">
          Login
        </h1>

        <p class="mt-2 text-slate-500">
          Silakan masuk ke akun Anda
        </p>
      </div>

      <!-- Form -->
      <form class="space-y-5">

        <!-- Email -->
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-700">
            Email
          </label>

          <input
            type="email"
            placeholder="Masukkan email"
            class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:ring-2 focus:ring-slate-900"
          />
        </div>

        <!-- Password -->
        <div>
          <label class="block mb-2 text-sm font-medium text-slate-700">
            Password
          </label>

          <input
            type="password"
            placeholder="Masukkan password"
            class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:ring-2 focus:ring-slate-900"
          />
        </div>

        <!-- Options -->
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 text-slate-600">
            <input type="checkbox" class="rounded">
            Remember me
          </label>

          <a href="#" class="text-slate-900 hover:underline">
            Lupa password?
          </a>
        </div>

        <!-- Button -->
        <button
          type="submit"
          class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-xl transition"
        >
          Login
        </button>

      </form>

      <!-- Footer -->
      <p class="mt-8 text-center text-sm text-slate-500">
        Belum punya akun?
        <a href="#" class="font-semibold text-slate-900 hover:underline">
          Daftar
        </a>
      </p>

    </div>

  </div>

</body>
</html>

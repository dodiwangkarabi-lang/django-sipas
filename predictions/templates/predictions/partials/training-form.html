<div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">

    <!-- Header -->
    <div class="px-6 py-4 border-b bg-gray-50">
        <h2 class="text-xl font-bold text-gray-800">
            Konfigurasi Training
        </h2>
        <p class="text-sm text-gray-500">
            Upload dataset baru atau gunakan dataset yang tersedia untuk pelatihan model
        </p>
    </div>

    <!-- Content -->
    <div class="p-6">

        <form method="post" enctype="multipart/form-data"
            @submit.prevent="$dispatch('submit-latih-model', { form : $event.target })"
        >

            <!-- Upload Dataset -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Upload Ulang Dataset
                </label>

                <input
                    type="file"
                    name="dataset"
                    accept=".csv,.xlsx"
                    class="block w-full text-sm text-gray-600
                           file:mr-4
                           file:py-2
                           file:px-4
                           file:rounded-lg
                           file:border-0
                           file:text-sm
                           file:font-medium
                           file:bg-indigo-50
                           file:text-indigo-700
                           hover:file:bg-indigo-100">
                
                <p class="mt-2 text-xs text-gray-500">
                    Kosongkan jika tetap menggunakan dataset saat ini.
                </p>
            </div>

            <!-- Action -->
            
            <div
                x-show="!loading" x-cloak
                class="mt-6 flex justify-end border-t pt-4"
            >
                <button
                    type="submit"
                    class="px-5 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">
                    Training Model
                </button>
            </div>
            <!-- loading -->
            <div
                x-show="loading"
                x-cloak
                class="flex items-center gap-3 p-4 border border-blue-200 bg-blue-50 rounded-lg"
            >
                <svg
                    class="w-5 h-5 animate-spin text-blue-600"
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                >
                    <circle
                        class="opacity-25"
                        cx="12"
                        cy="12"
                        r="10"
                        stroke="currentColor"
                        stroke-width="4"
                    ></circle>
                    <path
                        class="opacity-75"
                        fill="currentColor"
                        d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
                    ></path>
                </svg>

                <div>
                    <p class="font-medium text-blue-800">
                        Training model sedang berjalan
                    </p>
                    <p class="text-sm text-blue-600">
                        Mohon tunggu hingga proses selesai...
                    </p>
                </div>
            </div>

        </form>

    </div>

</div>

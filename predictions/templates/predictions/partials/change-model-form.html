{% if can_change_model %}
<div class="bg-white shadow rounded-lg p-4 flex items-center justify-between">

    <div>
        <h2 class="font-semibold">Model Aktif</h2>
        <p class="text-sm text-gray-500">
            {{ active_model.name }}
        </p>
    </div>

    <form method="post" action="">
        {% csrf_token %}

        <select name="model_id" class="border rounded px-2 py-1">
            {% for model in models %}
                <option value="{{ model.id }}"
                    {% if model.id == active_model.id %}selected{% endif %}>
                    {{ model.name }}
                </option>
            {% endfor %}
        </select>

        <button type="submit"
            class="ml-2 bg-blue-600 text-white px-3 py-1 rounded">
            Ganti
        </button>
    </form>

</div>
{% endif %}
